
name: Generar APK - Rumbo a Platino

on:
  workflow_dispatch:
  push:
    paths:
      - 'Proyecto_Android_Calculadora_Rumbo_a_Platino_con_icono.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar componentes Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Descomprimir proyecto
        run: |
          unzip -o Proyecto_Android_Calculadora_Rumbo_a_Platino_con_icono.zip -d .
          test -f CalculadoraComisionesAndroid/settings.gradle
          test -f CalculadoraComisionesAndroid/app/build.gradle

      - name: Compilar APK
        working-directory: CalculadoraComisionesAndroid
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculadora-Rumbo-a-Platino-APK
          path: CalculadoraComisionesAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
